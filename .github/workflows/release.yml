# LabNTP tag gate + GHCR publish.
#
# tag-gate runs on v* tag push and workflow_dispatch (re-gate only).
# publish-image runs only on push of tags v* (never dispatch) and builds
# only the commit tag-gate approved.
#
# The tag must match ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$.
# The tag is validated before checkout. Checkout is only refs/tags/<tag>.
# The step fails unless HEAD is that tag's peeled commit, and that commit
# is passed as -sha. The workflow retries only exit 75.
# Checkout used to take the raw ref, so a branch named like the tag could
# win actions/checkout, and the retry loop used to retry whenever the
# command output contained the word pending or the phrase no matching run.

name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      ref:
        description: Release tag to re-gate (vX.Y.Z or refs/tags/vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  checks: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.event.inputs.ref || github.ref }}
  cancel-in-progress: false

env:
  GO_VERSION: "1.26.9"
  GOTOOLCHAIN: local
  GOPROXY: https://proxy.golang.org,direct
  IMAGE: ghcr.io/hilather/labntp

jobs:
  tag-gate:
    name: tag-gate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      sha: ${{ steps.rev.outputs.sha }}
      ref: ${{ steps.rev.outputs.ref }}
    steps:
      - name: Canonicalize release ref
        id: tag
        env:
          RELEASE_REF: ${{ github.event.inputs.ref || github.ref }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          # Trim ends only. Internal whitespace still fails the pattern.
          ref="${ref#"${ref%%[![:space:]]*}"}"
          ref="${ref%"${ref##*[![:space:]]}"}"
          case "$ref" in
            refs/tags/*) ref="${ref#refs/tags/}" ;;
          esac
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$ref" =~ $re ]]; then
            echo "ref is not a release tag" >&2
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.tag.outputs.ref }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Resolve tag and peeled commit
        id: rev
        env:
          RELEASE_REF: ${{ steps.tag.outputs.ref }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          # Trim ends only. Internal whitespace still fails the pattern.
          ref="${ref#"${ref%%[![:space:]]*}"}"
          ref="${ref%"${ref##*[![:space:]]}"}"
          case "$ref" in
            refs/tags/*) ref="${ref#refs/tags/}" ;;
          esac
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$ref" =~ $re ]]; then
            echo "ref is not a release tag" >&2
            exit 1
          fi
          notes="docs/releases/${ref}.md"
          if [ ! -f "$notes" ]; then
            echo "missing release notes ${notes}" >&2
            exit 1
          fi
          sha="$(git rev-parse --verify --end-of-options "refs/tags/${ref}^{commit}")"
          head="$(git rev-parse --verify HEAD)"
          if [ "$head" != "$sha" ]; then
            echo "HEAD ${head} is not the peeled commit ${sha} of ${ref}" >&2
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "notes=${notes}" >> "$GITHUB_OUTPUT"

      - name: Reject dirty worktree
        run: git diff --exit-code && git diff --cached --exit-code

      - name: Verify generated files
        run: make verify-generated

      - name: Validate release notes headings
        env:
          NOTES: ${{ steps.rev.outputs.notes }}
        run: go run ./scripts/release-gate -notes-only -notes "$NOTES"

      - name: Build release-gate
        run: go build -o "$RUNNER_TEMP/release-gate" ./scripts/release-gate

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          # GitHub ignores step env that sets GITHUB_SHA, GITHUB_REF or
          # GITHUB_REF_NAME; on workflow_dispatch those name the dispatching
          # branch and its head.
          # Pass the tag and the checked-out commit explicitly.
          RELEASE_TAG: ${{ steps.rev.outputs.ref }}
          RELEASE_SHA: ${{ steps.rev.outputs.sha }}
        run: |
          set -euo pipefail
          for i in $(seq 1 70); do
            echo "release-gate: CI attempt ${i}/70" >&2
            set +e
            "$RUNNER_TEMP/release-gate" -require-ci -tag "$RELEASE_TAG" -sha "$RELEASE_SHA"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            # 75 is release-gate's retryable status. Do not match error text.
            if [ "$status" -eq 75 ]; then
              sleep 30
              continue
            fi
            exit "$status"
          done
          echo "CI run for this tag did not become green" >&2
          exit 1

  publish-image:
    name: publish-image
    needs: [tag-gate]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Canonicalize release ref
        id: tag
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          # Trim ends only. Internal whitespace still fails the pattern.
          ref="${ref#"${ref%%[![:space:]]*}"}"
          ref="${ref%"${ref##*[![:space:]]}"}"
          case "$ref" in
            refs/tags/*) ref="${ref#refs/tags/}" ;;
          esac
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$ref" =~ $re ]]; then
            echo "ref is not a release tag" >&2
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: refs/tags/${{ steps.tag.outputs.ref }}

      - name: Resolve peeled commit
        id: rev
        env:
          RELEASE_REF: ${{ steps.tag.outputs.ref }}
          GATED_SHA: ${{ needs.tag-gate.outputs.sha }}
          GATED_REF: ${{ needs.tag-gate.outputs.ref }}
        run: |
          set -euo pipefail
          ref="$RELEASE_REF"
          # Trim ends only. Internal whitespace still fails the pattern.
          ref="${ref#"${ref%%[![:space:]]*}"}"
          ref="${ref%"${ref##*[![:space:]]}"}"
          case "$ref" in
            refs/tags/*) ref="${ref#refs/tags/}" ;;
          esac
          re='^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'
          if [[ ! "$ref" =~ $re ]]; then
            echo "ref is not a release tag" >&2
            exit 1
          fi
          sha="$(git rev-parse --verify --end-of-options "refs/tags/${ref}^{commit}")"
          head="$(git rev-parse --verify HEAD)"
          if [ "$head" != "$sha" ]; then
            echo "HEAD ${head} is not the peeled commit ${sha} of ${ref}" >&2
            exit 1
          fi
          if [ -z "$GATED_SHA" ] || [ "$ref" != "$GATED_REF" ] || [ "$sha" != "$GATED_SHA" ]; then
            echo "ref ${ref} commit ${sha} is not gated ref ${GATED_REF} commit ${GATED_SHA}" >&2
            exit 1
          fi
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=tag
            type=sha,prefix=sha-,format=short
          flavor: |
            latest=false

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          push: true
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.tag.outputs.ref }}
            COMMIT=${{ steps.rev.outputs.sha }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}

      - name: Record digest
        env:
          RELEASE_REF: ${{ steps.tag.outputs.ref }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          {
            echo "ghcr.io/hilather/labntp:${RELEASE_REF}"
            echo "ghcr.io/hilather/labntp@${DIGEST}"
          } >> "$GITHUB_STEP_SUMMARY"

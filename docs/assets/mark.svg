<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">LabNTP</title>
  <desc id="desc">Two clock hands on one dial — one time per client.</desc>
  <rect width="64" height="64" rx="14" fill="#07090c"/>
  <circle cx="32" cy="32" r="23" fill="none" stroke="#1c242c" stroke-width="2"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#4fd6c0" stroke-width="1.25" opacity="0.85"/>
  <g stroke="#e8ece8" stroke-width="1.2" stroke-linecap="round" opacity="0.55">
    <line x1="32" y1="14" x2="32" y2="17"/>
    <line x1="32" y1="47" x2="32" y2="50"/>
    <line x1="14" y1="32" x2="17" y2="32"/>
    <line x1="47" y1="32" x2="50" y2="32"/>
  </g>
  <line x1="32" y1="32" x2="32" y2="18" stroke="#e8ece8" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="44" y2="38" stroke="#4fd6c0" stroke-width="1.8" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2.2" fill="#4fd6c0"/>
</svg>

apiVersion: labntp.dev/v1alpha1
kind: LabNTP
metadata:
  name: omitted-rate
spec:
  filters:
    - name: skew
      match:
        cidrs: ["10.0.0.1/32"]
      view:
        mode: offset
        offset: -6m
        minpoll: 6
        maxpoll: 10
    - name: default
      match:
        cidrs: ["0.0.0.0/0", "::/0"]
      view:
        mode: follow-real

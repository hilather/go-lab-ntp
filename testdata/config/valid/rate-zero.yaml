apiVersion: labntp.dev/v1alpha1
kind: LabNTP
metadata:
  name: rate-zero
spec:
  ntp:
    allowClientCidrs:
      - "127.0.0.0/8"
      - "::1/128"
  filters:
    - name: frozen-rate
      match:
        cidrs: ["10.0.0.1/32"]
      view:
        mode: rate
        rate: 0
        epoch: "2035-01-01T00:00:00Z"
    - name: default
      match:
        cidrs: ["0.0.0.0/0", "::/0"]
      view:
        mode: follow-real
